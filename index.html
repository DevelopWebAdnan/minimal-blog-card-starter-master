<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="icon" href="resources/favicon.ico" type="image/x-icon" sizes="96x96" />

  <title>devChallenges.io | Minimal Blog Card</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@100..800&display=swap" rel="stylesheet">
  <!--You are welcome to delete these styles or modify them in your own stylesheet -->
  <style>
    .sora-normal {
      font-family: "Sora", sans-serif;
      font-optical-sizing: auto;
      font-weight: 400;
      font-style: normal;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      height: 100vh;
    }

    main section {
      max-width: 400px;
      margin: 160px auto;
    }

    .card {
      width: 370px;
      padding: 16px;
      box-shadow: 8px 8px 20px 0px rgba(85, 85, 85, 0.08);
      background-color: #FFFFFF;
    }

    .content {
      border: 16px 16px 0 0;
    }

    figure {
      margin-bottom: 16px;
    }

    figure img {
      border-radius: 16px;
      width: 100%;
    }

    .design {
      display: inline-block;
      background-color: #F2EAFD;
      padding: 4px 16px;
      margin-bottom: 16px;
      border-radius: 16px;
      font-size: 0.625rem;
      color: #7C19EE;
      font-weight: 700;
    }

    h3 {
      margin-bottom: 6px;
      font-size: 1.125rem;
      color: #20293A;
    }

    .description {
      font-size: 0.875rem;
      color: #394150;
      font-weight:300;
    }

    .bordered-div {
      border-top: 1px solid #E5EAF0;
      padding: 20px 16px 20px 16px;
      border-radius: 0 0 16px 16px;
      font-size: 0.75rem;
      background-color: #FAFAF9;
      color: #394150;
      width: 370px;
      box-shadow: 8px 8px 20px 0px rgba(85, 85, 85, 0.08);
    }

    .author-info {
      font-size: 14px;
      text-align: center;
      margin-top: 16px;
      color: rgb(55, 65, 81);
    }

    .author-info a {
      text-decoration: none;
    }
  </style>
</head>

<body class="sora-normal">

  <header></header>
  <main>
    <section>
      <div class="card">
        <div class="content">
          <figure>
            <img src="./resources/Cactus.jpg" alt="Cactus image">
          </figure>
          <div class="design">Design</div>

          <h3>Embracing Minimalism</h3>

          <p class="description">From minimalist sculptures to minimalist paintings, this blog will inspire you to
            appreciate the beauty that lies in simplicity.</p>
        </div>
      </div>
      <div class="bordered-div">Annie Spratt</div>

    </section>
  </main>
  <footer></footer>
  <div class="author-info">
    Coded by <a href="#">Adnan</a> | Challenge by
    <a href="https://www.devchallenges.io?ref=challenge" target="_blank">devChallenges.io</a>.
  </div>
</body>

</html>
